<title>건강한교회 주보</title>
<!--
  HCC 주보 틀 (A4 세로 앞·뒤 2쪽) — 매주 아래 두 JSON 칸의 "값"만 바꿉니다. CSS·렌더러는 건드리지 않습니다.
    id=jubo-config : 고정 정보(교회·담임목사·주소·계좌·표어·교단·색·기본 순서) — 거의 안 바뀜
    id=jubo-data   : 이번 주 글(날짜·인도자·봉독·본문·설교·찬양·간증·특송·소식)
  규칙
    · 글자를 비운 칸("")은 인쇄물에 노란 「확인 필요」로 나옵니다. 모르는 값은 지어내지 말고 비워 두세요.
    · 순서 항목의 "@이름"은 jubo-data의 같은 이름 값으로 자동 치환됩니다.
    · 이번 주만 순서가 다르면 jubo-data에 "순서"를 통째로 넣으면 설정의 기본 순서보다 우선합니다.
    · 로고: 설정의 교회.로고(흰색 투명 PNG 경로, 예 assets/hcc-logo-white.png). 비우면 글자+「로고」 자리표시.
  글꼴: 원본 대조로 확정 — 본문·제목·라벨 Pretendard(가변), 찬양 줄·성경 본문 줄·설교 제목 고운바탕(Gowun Batang R/B). 둘 다 OFL, assets/fonts에 동봉·로컬 로딩.
  로고: 설정의 교회.로고 = assets/hcc-logo-white.png (HCC 홈페이지 원본 logo_all black.png를 흰색으로 바꾼 것). 원본 파일이 바뀌면 이 파일만 교체.
  원본 이미지 기준 좌표를 1/901 폭 단위(--u)로 옮긴 레이아웃입니다.
-->
<style>

mark.need{background:#ffe14d;color:#5c4200;font-weight:700;border-radius:calc(3*var(--u));padding:0 calc(5*var(--u));font-size:.86em;letter-spacing:0}
@media print{body{background:#fff}.stage{display:block;padding:0}.pg{box-shadow:none}}

<script id="jubo-render">
(function(){
  var cfg=JSON.parse(document.getElementById('jubo-config').textContent);
  var d=JSON.parse(document.getElementById('jubo-data').textContent);
  var dz=cfg.디자인||{};
  if(dz.주색) document.documentElement.style.setProperty('--g',dz.주색);
  if(dz.글꼴) document.documentElement.style.setProperty('--font','"'+dz.글꼴+'","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  // 괄호 안 글은 작게
  function rich(s){return esc(s).replace(/\(([^)]*)\)/g,'<span class="sm">($1)</span>')}
  function need(){return '<mark class="need">확인 필요</mark>'}
  function val(t){ // "@키" → 값. 비면 확인 필요
    if(typeof t!=='string'||t.charAt(0)!=='@') return t==null?'':rich(t);
    var k=t.slice(1), v=d[k];
    if(k==='인도자이름') v=d.인도자&&d.인도자.이름;
    if(v==null||v==='') return need();
    return rich(v);
  }
  function lines(t){ // 부가 줄 목록
    if(t==='@찬양'){
      var a=d.찬양||[]; if(!a.length) return [need()];
      return a.map(function(x){return x===''?'- '+need():'- '+rich(x)});
    }
    return [val(t)];
  }
  function item(it){
    var h='<div class="it"><div class="lb">'+rich(it.라벨)+'</div><div class="mn">'+esc(it.항목);
    if(it.담당) h+=' <span class="who">'+val(it.담당)+'</span>';
    h+='</div>';
    (it.부가||[]).forEach(function(l,i){lines(l).forEach(function(x,j){h+='<div class="sb'+(i+j===0?' first':'')+(x.indexOf('- ')===0?' ds':'')+'">'+x+'</div>'})});
    if(it.강조){var v=val(it.강조);h+='<div class="em">'+(v.indexOf('need')>-1?v:'"'+v+'"')+'</div>'}
    return h+'</div>';
  }
  function head(front){
    var ld='';
    if(front&&d.인도자){var n=d.인도자.이름,t=d.인도자.직분;ld='<div class="lead">* 인도자 '+(n?esc(n):need())+' '+esc(t||'')+'</div>'}
    return '<div class="head"><div class="date">'+esc(d.날짜)+'</div><div class="t1">'+esc(cfg.교회.이름)+'</div><div class="t2">'+esc(cfg.교회.부제)+'</div>__LD__</div><div class="rule"></div>'.replace('__LD__',ld);
  }
  function lat(s){return esc(s).replace(/[A-Za-z0-9:\/.\-]+/g,'<span class="la">$&</span>')}
  function foot(){
    var c=cfg.교회;
    var mark=c.로고?'<img class="logo" src="'+esc(c.로고)+'" alt="'+esc(c.이름)+'">'
      :'<div class="fn">'+esc(c.이름)+'</div><div class="fe">'+esc(c.영문)+'</div><div class="fl">로고</div>';
    return '<div class="ft">'+mark
     +'<div class="fp">담임목사&nbsp; '+esc(cfg.담임목사)+'</div>'
     +'<div class="fi"><b>예배공간</b> '+lat(cfg.주소)+'<br><b style="margin-right:calc(3*var(--u))">홈페이지</b> '+lat(cfg.홈페이지)+'<br><b style="margin-right:calc(2*var(--u))">온라인헌금</b> '+lat(cfg.헌금)+'</div>'
     +'<div class="fm">'+cfg.표어.map(esc).join('<br>')+'</div><div class="fd">'+esc(cfg.교단)+'</div></div>';
  }
  var order=d.순서||cfg.순서;
  var front='<div class="pg" id="p1">'+head(true)+order.map(function(col,i){return '<div class="col c'+(i+1)+'">'+col.map(item).join('')+'</div>'}).join('')+foot()+'</div>';
  function news(n){
    var h='<div class="nw"><div class="nt">'+(n.번호?n.번호+'. ':'')+(n.제목?esc(n.제목):need())+'</div>';
    var b=n.본문; if(b==null||b===''||(Array.isArray(b)&&!b.length)) h+='<p class="nb">'+need()+'</p>';
    else (Array.isArray(b)?b:[b]).forEach(function(x){h+='<p class="nb">'+esc(x)+'</p>'});
    if(n.세부&&n.세부.length) h+='<div class="nd">'+n.세부.map(esc).join('<br>')+'</div>';
    if(n.비고) h+='<div class="nn">'+esc(n.비고)+'</div>';
    return h+'</div>';
  }
  var ns=d.소식||[], half=Math.ceil(ns.length/2), left=ns.slice(0,half), right=ns.slice(half);
  if(d.소식단) {left=ns.slice(0,d.소식단[0]);right=ns.slice(d.소식단[0]);}
  var back='<div class="pg'+(dz.줄바꿈==='글자'?' brk':'')+'" id="p2">'+head()+'<div class="col c1">'+left.map(news).join('')+'</div><div class="col c2">'+right.map(news).join('')+'</div>'+foot()+'</div>';
  document.getElementById('stage').innerHTML=front+back;
  var o=(location.search.match(/only=(\d)/)||[])[1];
  if(o){document.body.style.background='#fff';document.getElementById('stage').style.cssText='display:block;padding:0';
    Array.prototype.forEach.call(document.querySelectorAll('.pg'),function(p,i){p.style.boxShadow='none';if(String(i+1)!==o)p.style.display='none'})}
})();
</script>
